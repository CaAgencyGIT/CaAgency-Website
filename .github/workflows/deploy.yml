name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check deployment preflight without changing the live release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy website
    # workflow_run uses the default branch SHA. Deploy only the exact commit CI tested.
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_sha == github.sha))
    runs-on: [self-hosted, Linux, X64, caagency-website-ci]
    timeout-minutes: 55
    environment: server-production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Verify VM isolation
        run: /usr/local/bin/verify-ci-isolation
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node runtime
        run: node --version
      - name: Deploy with GitHub identity
        run: node scripts/deploy-keyless.mjs
        env:
          DEPLOY_APP: website
          DEPLOY_DRY_RUN: ${{ inputs.dry_run }}
          # Automatically issued by GitHub for this job, never a stored deploy secret.
          GH_TOKEN: ${{ github.token }}
