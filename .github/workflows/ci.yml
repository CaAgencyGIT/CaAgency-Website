name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Lint/test only need a well-formed URL; the build job uses its own Postgres service.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/caagency_website"

jobs:
  lint:
    name: Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # Generated by the build; the sitemap routes import it.
      - run: node scripts/build-asset-manifest.mjs
      - run: node scripts/build-mobile-video-manifest.mjs

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vitest
        run: npm run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: caagency_website
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds prerender from the database; an empty migrated schema is enough.
      - run: npm run db:migrate:deploy

      - run: npm run build

  # NOTE: E2E (npm run test:e2e) is intentionally not in CI — it renders
  # DB-backed pages, so it needs a seeded database. Run it locally, or add a job here once a test-DB secret is wired up.
