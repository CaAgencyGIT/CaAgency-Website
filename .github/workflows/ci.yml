name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  # Do not cancel a push job while its production deployment is running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_COMPILE_CACHE: /home/ci/.cache/caagency-node
  # Fresh VM-local Postgres is ready before this runner registers with GitHub.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/caagency_website"
  NEXT_PUBLIC_HOSTING_PLATFORM: ${{ vars.NEXT_PUBLIC_HOSTING_PLATFORM }}
  NEXT_PUBLIC_PREVIEW_MODE: ${{ vars.NEXT_PUBLIC_PREVIEW_MODE }}
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
  NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
  NEXT_PUBLIC_GOOGLE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_VERIFICATION }}

jobs:
  check:
    # One disposable VM and dependency install for all checks avoids serial VM setup.
    name: Lint, types, tests & build
    runs-on: [self-hosted, Linux, X64, caagency-website-ci]
    timeout-minutes: 60
    # Environments apply to an entire job; PRs never enter production.
    environment:
      name: ${{ github.event_name == 'push' && 'server-production' || 'ci-validation' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Verify VM isolation
        run: /usr/local/bin/verify-ci-isolation

      - name: Checkout source
        run: node /usr/local/lib/caagency-ci/checkout-source.mjs website
        env:
          GH_TOKEN: ${{ github.token }}

      # Node 22 is already installed in the immutable VM base.
      - name: Node runtime
        run: node --version

      - name: Dependencies
        timeout-minutes: 10
        # Reuse installed modules only for identical package files and runtime.
        run: node /usr/local/lib/caagency-ci/install-dependencies.mjs

      - name: Prisma client
        run: node_modules/.bin/prisma generate

      - name: Asset manifest
        run: node scripts/build-asset-manifest.mjs

      - name: Mobile video manifest
        run: node scripts/build-mobile-video-manifest.mjs

      - name: Incremental check caches
        run: node /usr/local/lib/caagency-ci/restore-check-cache.mjs

      - name: Validate, tests & production build (parallel)
        timeout-minutes: 30
        # All checks overlap the full build; immutable route types prevent races and are verified again afterward.
        run: node /usr/local/lib/caagency-ci/validate-build.mjs website

      - name: Publish deployment build (parallel compression)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: node scripts/publish-ci-build.mjs

      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        timeout-minutes: 50
        # Runs after successful checks/build publication in this same job and VM.
        run: node /usr/local/lib/caagency-ci/deploy-client.mjs
        env:
          DEPLOY_APP: website
          DEPLOY_DRY_RUN: 'false'
          GH_TOKEN: ${{ github.token }}

  # E2E still requires a seeded database; it is not part of this CI workflow.
