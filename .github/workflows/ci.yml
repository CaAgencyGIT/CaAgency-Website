name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/caagency_website"
  NEXT_PUBLIC_HOSTING_PLATFORM: ${{ vars.NEXT_PUBLIC_HOSTING_PLATFORM }}
  NEXT_PUBLIC_PREVIEW_MODE: ${{ vars.NEXT_PUBLIC_PREVIEW_MODE }}
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
  NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
  NEXT_PUBLIC_GOOGLE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_VERIFICATION }}

jobs:
  check:
    # One disposable VM and dependency install for all checks avoids serial VM setup.
    name: Lint, types, tests & build
    runs-on: [self-hosted, Linux, X64, caagency-website-ci]
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: caagency_website
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Verify VM isolation
        run: /usr/local/bin/verify-ci-isolation

      - uses: actions/checkout@v4

      # Node 22 is already installed in the immutable VM base.
      - name: Node runtime
        run: node --version

      - name: Dependencies
        # Reuse installed modules only for identical package files and runtime.
        run: node /usr/local/lib/caagency-ci/install-dependencies.mjs

      - name: Prisma client
        run: npx prisma generate

      - name: Asset manifest
        run: node scripts/build-asset-manifest.mjs

      - name: Incremental check caches
        run: node /usr/local/lib/caagency-ci/restore-check-cache.mjs

      - name: TypeScript, ESLint & unit tests (parallel)
        run: node /usr/local/lib/caagency-ci/run-checks.mjs website

      # Builds prerender from the database; an empty migrated schema is enough.
      - run: npm run db:migrate:deploy

      - name: Build
        # Only compiler work is restored; every job still builds the current source.
        # The trusted snapshot is separate from both PR writes and production caches.
        run: |
          node /usr/local/lib/caagency-ci/restore-next-cache.mjs
          npm run build

      - name: Publish deployment build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: node scripts/publish-ci-build.mjs

  # E2E still requires a seeded database; it is not part of this CI workflow.
